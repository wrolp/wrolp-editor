[package]
name = "wrolp-editor"
version = "0.0.4"
description = "WROLP Editor - a simple local text editor"
authors = ["wrolp"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wrolp_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
base64 = "0.22"
argon2 = "0.6"
aes-gcm = { version = "0.10", features = ["aes"] }
getrandom = "0.2"
zeroize = "1"
keyring-core = "1.0.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
arboard = "3.6"
# `https` and `ssh` are the transports the Source Control panel needs. On Windows `https` is
# served by libgit2's WinHTTP backend (system TLS, proxy and certificate store), so it pulls in no
# OpenSSL; `ssh` does add libssh2, which is the one dependency that has to be watched at build time.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "https", "ssh"] }
# The AI request channel. rustls keeps the build free of OpenSSL on Windows; `stream` is the
# SSE path, `json` the request body.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
# The chat stream's idle timeout: a long answer must not be cut off by a total deadline, but a
# service that has stopped sending must be named instead of waiting forever.
tokio = { version = "1", features = ["time"] }
# Archive browsing: `zip` reads the central directory (so a listing costs no unpacking) and
# deflate entries; `tar` + `flate2` cover `.tar` and `.tar.gz`. All three are pure Rust, so the
# build keeps the same Windows story as the rest of the tree.
# `aes-crypto` is what lets an encrypted zip be tried against a password: the archive password
# chain in `archive_passwords.rs` would otherwise have to refuse every WinZip AES archive.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
# Archive password rules are regular expressions. `regex` runs in linear time, so a hostile or
# accidental catastrophically-backtracking pattern cannot stall the listing.
regex = "1"
# 7z reads through the decoder only: the `compress` feature (the writer) is left off the build
# and switched back on for tests, which need it to produce a sample.
sevenz-rust = { version = "0.6", default-features = false }
# Thumbnails for archive pictures: the grid decodes a 256-pixel copy instead of a dozen
# full-size photographs at once. Only the decoders the gallery can show are compiled in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }

[dev-dependencies]
sevenz-rust = { version = "0.6", default-features = false, features = ["compress"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-native-keyring-store = "1.1.0"
# Windows' own OCR engine: no model to download, and it runs offline. The crate was already in
# the tree as a transitive dependency; naming the features here is what compiles the OCR and
# imaging APIs.
windows = { version = "0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
] }
winreg = "0.52"
# Some capture tools (WeChat's screenshot among them) publish the bitmap only under the
# MIME-spelled "image/png" registration, which arboard's standard "PNG" / CF_DIBV5 lookup
# misses. This reads those formats for the paste paths; it is already in the tree as
# arboard's Windows backend.
clipboard-win = "5"
# DPAPI (CryptProtectData), for the one secret that lives in the settings file rather than the
# credential store: the settings page has to be able to read it back, and a value only this
# Windows account can decrypt is what makes that file safe to copy into a backup.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
