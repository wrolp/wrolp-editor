[package]
name = "wrolp-editor"
version = "0.0.1"
description = "WROLP Editor - a simple local text editor"
authors = ["wrolp"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wrolp_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
argon2 = "0.6"
aes-gcm = { version = "0.10", features = ["aes"] }
getrandom = "0.2"
zeroize = "1"
keyring-core = "1.0.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
arboard = "3.6"
# `https` and `ssh` are the transports the Source Control panel needs. On Windows `https` is
# served by libgit2's WinHTTP backend (system TLS, proxy and certificate store), so it pulls in no
# OpenSSL; `ssh` does add libssh2, which is the one dependency that has to be watched at build time.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "https", "ssh"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows-native-keyring-store = "1.1.0"
winreg = "0.52"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
